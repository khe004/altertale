<style>
/* Layout: a 线装书 page — story column on rice paper, 军情 sidebar like a 题签 slip; indigo cloth accents, one vermilion seal. */
:root {
  --paper: #EDEFEA;
  --panel: #E2E6E1;
  --ink: #1D2127;
  --muted: #5D6672;
  --line: #C9CFCB;
  --indigo: #2B4A6E;
  --indigo-soft: #D5DDE6;
  --seal: #A33A30;
  --river: #9DB4C8;
  --shu: #3E7A4D;
  --wu: #B04A3C;
  --wei: #3A5D92;
  --war: #B08A2E;
  --mount: #9A9384;
  --mount-fill: #D9D4C7;
  --font-display: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --font-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121820; --panel: #18202A; --ink: #DADDD6; --muted: #8C96A2; --line: #2B3540;
    --indigo: #93B2D6; --indigo-soft: #223246; --seal: #D4695E; --river: #35506A;
    --shu: #6FB07E; --wu: #DB7B6C; --wei: #7EA2D8; --war: #D2AE55; --mount: #6E6A60; --mount-fill: #2A2E33; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121820; --panel: #18202A; --ink: #DADDD6; --muted: #8C96A2; --line: #2B3540;
  --indigo: #93B2D6; --indigo-soft: #223246; --seal: #D4695E; --river: #35506A;
  --shu: #6FB07E; --wu: #DB7B6C; --wei: #7EA2D8; --war: #D2AE55; --mount: #6E6A60; --mount-fill: #2A2E33; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.9; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 72rem; margin: 0 auto; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.6rem; color: var(--indigo); line-height: 1.2; }

.top .date { font-family: var(--font-ui); font-size: 0.85rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.ui-btn { font-family: var(--font-ui); font-size: 0.8rem; padding: 0.3rem 0.7rem; border: 1px solid var(--line); background: transparent; border-radius: 3px; color: var(--muted); }
.ui-btn:hover { color: var(--ink); border-color: var(--muted); }
#panelToggle { display: none; }

.wrap { max-width: 72rem; margin: 0 auto; padding-inline: 1rem; padding-block: 1.5rem 4rem; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 2.5rem; align-items: start; }
main { min-width: 0; }
.story { max-width: 38em; }

/* start screen */
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.6rem, 8vw, 4.2rem); color: var(--indigo); line-height: 1.1; margin: 0.5rem 0 0.25rem; text-wrap: balance; }
.intro .tag { font-size: 1.05rem; color: var(--muted); margin: 0 0 1.5rem; }
.intro p { margin: 0 0 1rem; }
.starts { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.start-card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.1rem; display: grid; gap: 0.35rem; }
.start-card:hover { border-color: var(--indigo); }
.start-card .k { font-family: var(--font-ui); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--muted); }
.start-card strong { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; color: var(--indigo); line-height: 1.3; }
.start-card span { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }
.keybox { font-family: var(--font-ui); font-size: 0.82rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 1rem; margin-top: 1.5rem; display: grid; gap: 0.5rem; }
.keybox input { padding: 0.35rem 0.5rem; border: 1px solid var(--line); background: var(--paper); border-radius: 3px; width: 100%; max-width: 26rem; }

/* chapters */
.chapter { margin-bottom: 2.5rem; }
.chapter-head { display: flex; gap: 0.9rem; align-items: flex-start; margin-bottom: 1rem; }
.seal { flex: none; width: 2.6rem; height: 2.6rem; border: 2px solid var(--seal); color: var(--seal); border-radius: 3px; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.15rem; line-height: 1; transform: rotate(-4deg); }
.chapter h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.35rem, 3.6vw, 1.75rem); line-height: 1.45; margin: 0; color: var(--ink); text-wrap: balance; }
.chapter .body p { margin: 0 0 1em; text-indent: 2em; }
.decision { font-family: var(--font-ui); font-size: 0.88rem; color: var(--indigo); background: var(--indigo-soft); border-radius: 3px; padding: 0.55rem 0.8rem; margin: 1.25rem 0 0; display: flex; gap: 0.75rem; align-items: baseline; flex-wrap: wrap; }
.decision b { font-weight: 500; }
.decision .redo { margin-left: auto; font-size: 0.78rem; background: none; border: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.decision .redo:hover { color: var(--ink); }
.divider { text-align: center; color: var(--line); letter-spacing: 1em; margin: 0 0 2.5rem; font-size: 0.8rem; }

/* choices */
.choices { border-top: 2px solid var(--indigo); padding-top: 1rem; margin-top: 0.5rem; }
.choices h3 { font-family: var(--font-ui); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 0.75rem; }
.choice-list { display: grid; gap: 0.6rem; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0.7rem 0.9rem; display: grid; gap: 0.15rem; line-height: 1.6; }
.choice:hover:not(:disabled) { border-color: var(--indigo); }
.choice b { font-weight: 600; }
.choice span { font-family: var(--font-ui); font-size: 0.82rem; color: var(--muted); }
.choice:disabled { opacity: 0.55; cursor: default; }
.own { margin-top: 0.9rem; display: grid; gap: 0.5rem; }
.own label { font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); }
.own textarea { width: 100%; min-height: 4.5rem; resize: vertical; padding: 0.6rem 0.75rem; border: 1px solid var(--line); background: var(--paper); border-radius: 4px; line-height: 1.7; }
.own .row { display: flex; gap: 0.5rem; justify-content: flex-end; }
.primary { font-family: var(--font-ui); font-size: 0.88rem; padding: 0.45rem 1.1rem; border: none; background: var(--indigo); color: var(--paper); border-radius: 3px; }
.primary:disabled { opacity: 0.5; cursor: default; }

.assess { font-size: 0.95rem; color: var(--muted); margin: 0 0 0.9rem; padding-left: 0.8rem; border-left: 2px solid var(--line); }
.choice.quiet { background: transparent; border-style: dashed; }
.policy { margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: 1rem; display: grid; gap: 0.6rem; font-family: var(--font-ui); font-size: 0.85rem; }
.policy h3 { margin: 0; }
.policy .hint { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.7; }
.policy label { color: var(--muted); font-size: 0.8rem; }
.policy textarea { width: 100%; min-height: 3.8rem; resize: vertical; padding: 0.55rem 0.7rem; border: 1px solid var(--line); background: var(--paper); border-radius: 4px; line-height: 1.7; font-family: var(--font-body); }
.power { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.power .who { font-weight: 500; min-width: 3.5em; }
.power .desc { color: var(--muted); font-size: 0.78rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: none; background: transparent; padding: 0.25rem 0.7rem; font-size: 0.8rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--indigo); color: var(--paper); }
.auto { font-family: var(--font-ui); font-size: 0.85rem; background: var(--panel); border-radius: 4px; padding: 0.6rem 0.85rem; margin-top: 0.5rem; }
.auto h4 { margin: 0 0 0.3rem; font-weight: 500; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
.auto ul { margin: 0; padding-left: 1.1em; display: grid; gap: 0.2rem; }
.auto b { font-weight: 500; margin-right: 0.5em; }
.redo-link { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 0.78rem; }
.events { font-family: var(--font-ui); font-size: 0.84rem; margin-top: 0.6rem; }
.events summary { cursor: pointer; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.08em; }
.events ul { margin: 0.5rem 0 0; padding-left: 0; list-style: none; display: grid; gap: 0.35rem; }
.events li { display: block; line-height: 1.65; }
.events .when { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 0.5em; }
.events em { font-style: normal; font-size: 0.72rem; color: var(--seal); border: 1px solid var(--seal); border-radius: 2px; padding: 0 0.25em; margin-left: 0.4em; }
.forces .fig { grid-template-columns: 5em minmax(0, 1fr); }
.usage { width: 100%; border-collapse: collapse; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.usage td, .usage th { text-align: right; padding: 0.15rem 0.3rem; font-weight: 400; }
.usage th, .usage td:first-child { text-align: left; }
.usage tr:first-child td { color: var(--muted); }
.usage .sub td { text-align: left; color: var(--muted); font-size: 0.72rem; padding-top: 0; }
.note { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.72rem; }
.report h4 { font-family: var(--font-ui); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); margin: 0.9rem 0 0.3rem; }
.report ol, .report ul { margin: 0; padding-left: 1.3em; font-size: 0.93rem; }
.report li { margin-bottom: 0.2rem; }
.rp-top { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.rp-top h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; color: var(--indigo); margin: 0; }
.rp-top .ui-btn { margin-left: auto; }
.rp-verdict { border-left: 3px solid var(--seal); background: var(--panel); padding: 0.4rem 0.8rem; margin: 0.8rem 0 0.4rem; border-radius: 0 3px 3px 0; }
.rp-m { color: var(--muted); font-size: 0.85rem; font-family: var(--font-ui); }
.rp-ch { border-top: 1px solid var(--line); padding-block: 1rem; }
.rp-ch header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.9rem; }
.rp-no { font-family: var(--font-display); font-size: 1.3rem; color: var(--seal); }
.rp-date { font-family: var(--font-ui); font-size: 0.88rem; }
.rp-places { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-left: auto; }
.rp-pl { font-family: var(--font-ui); font-size: 0.72rem; border-radius: 2px; padding: 0 0.35rem; color: var(--paper); }
.rp-g { font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rp-g b { color: var(--ink); font-weight: 500; }
.rp-d { font-size: 0.72rem; margin-left: 0.15rem; } .rp-d.up { color: var(--shu); } .rp-d.down { color: var(--seal); }
.rp-ev li.dark { color: var(--muted); }
.rp-ev .when { font-family: var(--font-ui); font-size: 0.78rem; color: var(--muted); margin-right: 0.4rem; }
.rp-ev em { font-style: normal; font-family: var(--font-ui); font-size: 0.68rem; color: var(--seal); border: 1px solid var(--seal); border-radius: 2px; padding: 0 0.2rem; margin-left: 0.35rem; }
.counsel { display: grid; gap: 0.5rem; margin: 0 0 1rem; }
.counsel h4 { margin: 0; font-family: var(--font-ui); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
.cs { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 0.75rem; align-items: baseline; }
.cs .who { font-family: var(--font-ui); font-weight: 500; font-size: 0.88rem; display: grid; line-height: 1.4; }
.cs .who small { font-weight: 400; font-size: 0.7rem; color: var(--muted); }
.cs p { margin: 0; font-size: 0.95rem; }
.choice .by { font-style: normal; font-family: var(--font-ui); font-weight: 400; font-size: 0.72rem; color: var(--indigo); border: 1px solid var(--indigo); border-radius: 2px; padding: 0 0.3rem; margin-left: 0.5rem; vertical-align: 0.1em; }
.grain { margin-left: 0.5em; color: var(--muted); }
.eta { color: var(--muted); font-size: 0.78rem; }
.reveals { display: grid; gap: 0.75rem; }
.reveal { display: grid; gap: 0.15rem; }
.reveal .where { font-family: var(--font-ui); font-size: 0.72rem; color: var(--seal); letter-spacing: 0.08em; }
.reveal q { font-style: normal; color: var(--ink); }
.reveal q::before { content: "「"; } .reveal q::after { content: "」"; }
.reveal p { color: var(--muted); font-size: 0.92rem; }
.writing { font-family: var(--font-ui); font-size: 0.88rem; color: var(--muted); display: flex; align-items: center; gap: 0.75rem; margin: 0 0 1rem; }
.writing .dots::after { content: "……"; display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.notice { font-family: var(--font-ui); font-size: 0.85rem; border: 1px solid var(--seal); color: var(--seal); border-radius: 4px; padding: 0.6rem 0.8rem; margin: 1rem 0; display: grid; gap: 0.5rem; }
.notice .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.ending { border: 2px solid var(--seal); border-radius: 4px; padding: 1.1rem 1.25rem; margin: 1rem 0 2rem; }
.ending .k { font-family: var(--font-ui); font-size: 0.72rem; letter-spacing: 0.14em; color: var(--seal); }
.ending h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0.2rem 0 0.5rem; color: var(--seal); }
.ending h4 { font-family: var(--font-ui); font-weight: 500; font-size: 0.82rem; color: var(--muted); margin: 1rem 0 0.25rem; letter-spacing: 0.08em; }
.ending p { margin: 0; }
.ending ol { margin: 0; padding-left: 1.4em; font-size: 0.92rem; }

/* sidebar */
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4rem); font-family: var(--font-ui); font-size: 0.85rem; line-height: 1.6; display: grid; gap: 1.1rem; max-height: calc(100vh - 5rem); overflow-y: auto; padding-right: 0.25rem; }
aside h3 { font-weight: 500; font-size: 0.72rem; letter-spacing: 0.16em; color: var(--muted); margin: 0 0 0.4rem; }
.map svg { width: 100%; height: auto; display: block; background: var(--panel); border-radius: 4px; }
.legend { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
.legend i { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.25rem; vertical-align: 0; }
.gauges { display: grid; gap: 0.45rem; }
.gauge { display: grid; grid-template-columns: 4.5em 1fr 2em; gap: 0.5rem; align-items: center; }
.gauge .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--indigo); border-radius: 3px; transition: width 0.6s ease; }
.gauge .bar i.low { background: var(--seal); }
.gauge .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.figures { display: grid; gap: 0.3rem; margin: 0; }
.fig { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); gap: 0.5rem; }
.fig dt { font-weight: 500; }
.fig dd { margin: 0; color: var(--muted); }
.fig dd b { color: var(--ink); font-weight: 400; }
.fig.dead dt, .fig.dead dd b { text-decoration: line-through; color: var(--muted); }
.intel { margin: 0; padding-left: 1.1em; display: grid; gap: 0.25rem; }
.hidden-box { border: 1px dashed var(--line); border-radius: 4px; padding: 0.6rem 0.75rem; }
.hidden-box p { margin: 0; color: var(--muted); font-size: 0.8rem; }
.hidden-box ul { margin: 0.4rem 0 0; padding-left: 1.1em; display: grid; gap: 0.25rem; }
.chron { margin: 0; padding-left: 1.4em; display: grid; gap: 0.2rem; color: var(--muted); font-size: 0.8rem; }

@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  #panelToggle { display: inline-block; }
  aside { position: static; max-height: none; order: -1; border: 1px solid var(--line); border-radius: 4px; padding: 0.9rem; background: var(--panel); }

  .writing .dots::after { animation: none; }

}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">异章·荆州<small>改变一个选择，让故事重新演化</small></div>

    <button class="ui-btn" id="panelToggle" type="button" aria-expanded="false">局势</button>

<script>
"use strict";

/* ───────── 世界设定 ───────── */

const PLACES = {
  "成都": [52, 196], "汉中": [78, 84], "上庸": [160, 82], "樊城": [232, 58], "襄阳": [232, 92],
  "许都": [338, 34], "秭归": [120, 198], "夷陵": [176, 189], "麦城": [200, 150], "江陵": [232, 176],
  "公安": [246, 206], "陆口": [306, 208], "建业": [384, 186]
};
const FACTION = { "刘": "--shu", "孙": "--wu", "曹": "--wei", "争": "--war" };

// 驿程表：[甲, 乙, 甲→乙天数(信使, 轻兵, 大军), 乙→甲天数, 说明]。水路顺流快、逆流慢；大军另加集结约十日。
const ROUTES = [
  ["成都", "秭归", [8, 12, 30], [12, 20, 45], "长江顺流出三峡；逆流上溯极慢"],
  ["秭归", "夷陵", [1, 2, 4], [1, 3, 6], "峡口"],
  ["夷陵", "江陵", [1, 2, 4], [2, 3, 6], "长江"],
  ["江陵", "公安", [1, 1, 2], [1, 1, 2], "隔江相望"],
  ["江陵", "麦城", [1, 2, 4], [1, 2, 4], "经当阳，陆路"],
  ["麦城", "襄阳", [2, 3, 8], [2, 3, 8], "陆路，近荆山"],
  ["襄阳", "樊城", [1, 1, 1], [1, 1, 1], "隔汉水"],
  ["成都", "汉中", [6, 10, 30], [6, 10, 30], "金牛道，翻大巴山"],
  ["汉中", "上庸", [6, 10, 25], [6, 10, 25], "山路"],
  ["上庸", "襄阳", [3, 5, 12], [5, 8, 20], "汉水顺流，经武当山下"],
  ["江陵", "陆口", [3, 4, 8], [4, 6, 12], "长江顺流东下；吴人西上为逆流"],
  ["陆口", "建业", [6, 10, 25], [10, 15, 35], "长江"],
  ["樊城", "洛阳", [3, 6, 15], [3, 6, 15], "陆路"],
  ["洛阳", "许都", [2, 4, 8], [2, 4, 8], "陆路"]
];
const TIERS = ["信使", "轻兵", "大军"];
const MUSTER = { "大军": 10 };

${ROUTES.map(([a, b, f, r, note]) => `- ${a}→${b}：${f.join(" / ")} 日；${b}→${a}：${r.join(" / ")} 日（${note}）`).join("\n")}

function travelDays(from, to, tier) {
  const t = TIERS.indexOf(tier);
  if (t < 0 || !ROUTE_NODES.includes(from) || !ROUTE_NODES.includes(to)) return null;
  const dist = { [from]: 0 }, done = new Set();
  for (;;) {
    let u = null;
    for (const n of ROUTE_NODES) if (!done.has(n) && dist[n] != null && (u == null || dist[n] < dist[u])) u = n;
    if (u == null) return null;
    if (u === to) return dist[u];
    done.add(u);
    for (const [a, b, f, r] of ROUTES) {
      const step = a === u ? [b, f[t]] : b === u ? [a, r[t]] : null;
      if (step && (dist[step[0]] == null || dist[u] + step[1] < dist[step[0]])) dist[step[0]] = dist[u] + step[1];
    }
  }
}

const CN_D = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
function cnNum(s) {
  if (s === "正") return 1;
  if (s === "冬") return 11;
  if (s === "腊") return 12;
  if (!s.includes("十")) return CN_D[s] || 0;
  const [a, b] = s.split("十");
  return (a ? CN_D[a] : 1) * 10 + (b ? CN_D[b] : 0);
}
const cnBig = n => n <= 10 ? NUMS[n - 1] : (n >= 20 ? NUMS[Math.floor(n / 10) - 1] : "") + "十" + (n % 10 ? NUMS[n % 10 - 1] : "");
function parseDate(str, year) {
  const m = /(?:建安([一二三四五六七八九十]+)年)?\s*闰?([正冬腊一二三四五六七八九十]+)月\s*(上旬|中旬|下旬|初|中|末|底)?/.exec(str || "");
  if (!m) return null;
  const y = m[1] ? cnNum(m[1]) : year;
  const mo = cnNum(m[2]);
  if (!y || !mo) return null;
  const d = { "上旬": 5, "初": 5, "中旬": 15, "中": 15, "下旬": 25, "末": 28, "底": 28 }[m[3]] ?? 15;
  return (y - 24) * 360 + (mo - 1) * 30 + d;
}
function fmtDate(n) {
  const y = 24 + Math.floor(n / 360), r = n - (y - 24) * 360, mo = Math.floor(r / 30) + 1, d = r - (mo - 1) * 30;
  return `建安${cnBig(y)}年${mo === 1 ? "正" : cnBig(mo)}月${d <= 10 ? "上旬" : d <= 20 ? "中旬" : "下旬"}`;
}

/* ───────── 语言模型 ───────── */

async function initLLM() {
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const sample = await window.claude.use("sample");
      if (sample) {
        llm = {
          kind: "claude",
          call: async (prompt, onText, signal, opts = {}) => {
            const r = await sample(prompt, { onText: ({ text }) => onText(text), signal, cache: false, ...(opts.tier ? { modelTier: opts.tier } : {}) });
            return { text: r.text, model: "claude.ai", tier: r.modelTierApplied || "default" };
          }
        };
        render();
        return;
      }
    } catch (e) {}
  }
  setupKeyLLM();
  render();
}

function setupKeyLLM() {
  let key = "";
  try { key = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}
  llm = key ? { kind: "key", call: (p, onText, signal, opts = {}) => callAnthropic(key, p, onText, signal, opts.tier === "quick" ? QUICK_MODEL : API_MODEL) } : null;
}

async function callAnthropic(key, prompt, onText, signal, model) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json", "x-api-key": key,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model, max_tokens: 8000, stream: true, messages: [{ role: "user", content: prompt }] })
  });
  if (!res.ok) throw { code: "http_" + res.status, message: await res.text() };
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", text = "";
  const meta = { model, tier: "", inTok: 0, outTok: 0 };
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      try {
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "message_start" && ev.message) {
          meta.model = ev.message.model || meta.model;
          const u = ev.message.usage || {};
          meta.inTok = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
        } else if (ev.type === "message_delta" && ev.usage) {
          meta.outTok = ev.usage.output_tokens || meta.outTok;
        } else if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
          text += ev.delta.text;
          onText(text);
        } else if (ev.type === "error") throw { code: "upstream_error", message: ev.error && ev.error.message };
      } catch (e) { if (e && e.code) throw e; }
    }
  }
  return { text, ...meta };
}

/* ───────── 驿程：把命令拆成要送出的各项，由驿程表算定送达日期 ───────── */

function buildRoutePrompt(g, decision) {
  const st = g.chapters[g.chapters.length - 1].state;
  return `把汉中王刘备的这道命令拆成需要送出或派出的各项。全部用中文。
地点只能从这些里选：${ROUTE_NODES.join("、")}。
每项写：part（这一项做什么，二十字以内）、from（命令或兵马从哪里出发，通常是成都）、to（送达或抵达之地；传令给某人，就取此人此刻所在之地）、tier（只传令写"信使"；派数百至两三千精兵、轻骑、轻舟写"轻兵"；派上万人或带辎重的兵马写"大军"）。派兵的同时附带传令的，只写兵马一项。
人物此刻所在：${(st.figures || []).map(f => `${f.name}在${f.where}`).join("；")}
命令：${decision}
只输出一个 JSON 数组，例如 [{"part":"令关羽撤围回守江陵","from":"成都","to":"樊城","tier":"信使"}]`;
}

function parseRoutes(raw) {
  const t = String(raw || "").replace(/```(json)?/g, "");
  const a = t.indexOf("["), b = t.lastIndexOf("]");
  if (a < 0 || b < a) return [];
  try {
    const node = x => ROUTE_NODES.find(n => String(x || "").includes(n)) || null;
    return JSON.parse(t.slice(a, b + 1)).filter(r => r && r.part).map(r => ({
      part: String(r.part), from: node(r.from) || "成都", to: node(r.to),
      tier: TIERS.find(x => String(r.tier || "").includes(x)) || "信使"
    }));
  } catch (e) { return []; }
}

// 返回新的军令表：沿用尚未送达的旧令，加上本回新令（发出日 = 当前回末）
function scheduleOrders(g, routes) {
  const st = g.chapters[g.chapters.length - 1].state;
  const now = parseDate(st.date, yearOf(st.date));
  const fresh = routes.map(r => {
    const days = now == null || !r.to ? null : travelDays(r.from, r.to, r.tier);
    return { ...r, sent: now, arrive: days == null ? null : now + days + (MUSTER[r.tier] || 0) };
  });
  return [...(st.orders || []), ...fresh];
}

const orderLine = o => `「${o.part}」${o.tier}自${o.from}${o.to ? "往" + o.to : ""}，${o.sent != null ? fmtDate(o.sent) + "发出，" : ""}${o.arrive != null ? `约${fmtDate(o.arrive)}${o.tier === "信使" ? "送达" : "抵达"}` : "日程按常理估算"}`;

/* ───────── 推演：只出事实 ───────── */

const evLine = e => `[${e.date || ""}] ${e.who || ""}@${e.where || ""}：${e.what || ""}${e.result ? " → " + e.result : ""}${e.known === false ? "（刘备不知）" : ""}`;

授权：${DELEGATES.map(d => `${d}：${g.policy.powers[d]}`).join("；")}（授权只在此人身处荆州时有效；方略与授权的改动随本回信使送达后才生效）

【刘备本回的命令】
${decision}

【军令驿程】（由驿程表算定，必须遵守；本回时间段内送达的，要写出接令情形）
${(orders || []).map(orderLine).join("\n") || "（无在途军令）"}

请推演第${cn(n)}回，本回时间推进约二十日至一月${span}。${last}

const LATIN = /[A-Za-z]/;
// 收集所有字符串值里夹杂的外文词（不看 JSON 的键名）
const latinWords = v => typeof v === "string" ? (v.match(/[A-Za-z]{2,}/g) || [])
  : Array.isArray(v) ? v.flatMap(latinWords) : v && typeof v === "object" ? Object.values(v).flatMap(latinWords) : [];
// 刘备的立场底线：不联曹、不降。违背的选项直接去掉。
const STANCE_BREACH = /联曹|降曹|附曹|投曹|归曹|结好曹|通好曹|与曹[操魏]?(?:议和|结盟|联手|修好|讲和)|称臣于[曹魏]|向[曹魏][^，。]{0,4}称臣|降吴|降魏/;

function parseSim(g, raw, orders) {
  const t = String(raw || "").replace(/```(json)?/g, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw { code: "no_state" };
  const s = JSON.parse(t.slice(a, b + 1));
  const prev = g.chapters[g.chapters.length - 1].state;
  const places = { ...prev.places };
  for (const [k, v] of Object.entries(s.places || {})) if (k in PLACES && v in FACTION) places[k] = v;
  s.places = places;
  const gauges = { ...prev.gauges };
  for (const k of Object.keys(gauges)) {
    const v = Number((s.gauges || {})[k]);
    if (Number.isFinite(v)) gauges[k] = Math.max(0, Math.min(100, Math.round(v)));
  }
  s.gauges = gauges;
  if (!Array.isArray(s.figures) || !s.figures.length) s.figures = prev.figures;
  if (!Array.isArray(s.forces) || !s.forces.length) s.forces = prev.forces || [];
  if (!Array.isArray(s.plans) || !s.plans.length) s.plans = prev.plans || [];
  for (const k of ["events", "intel", "hidden", "foreshadow", "autonomous", "counsel"]) s[k] = Array.isArray(s[k]) ? s[k] : [];
  if (!s.events.length) throw { code: "no_state" };
  s.date = s.date || prev.date;
  const all = Array.isArray(s.choices) ? s.choices.filter(c => c && c.label) : [];
  s.choices = all.filter(c => !STANCE_BREACH.test(c.label + c.detail)).slice(0, 3);
  s.dropped = all.length - all.filter(c => !STANCE_BREACH.test(c.label + c.detail)).length;
  if (!s.ending && !s.choices.length) throw { code: "no_choices" };
  // 选项删去后，进言对应的序号按原序号重新映射
  const keep = all.filter(c => s.choices.includes(c));
  s.counsel = s.counsel.map(c => ({ ...c, choice: keep.indexOf(all[(Number(c.choice) || 0) - 1]) + 1 }));
  // 在途军令由代码按驿程表结算，不用模型自报
  const now = parseDate(s.date, yearOf(prev.date));
  const list = orders || prev.orders || [];
  s.orders = list.filter(o => o.arrive != null && (now == null || o.arrive > now));
  s.delivered = list.filter(o => o.arrive != null && now != null && o.arrive <= now);
  s.in_transit = s.orders.map(o => ({ order: o.part, eta: `${fmtDate(o.arrive)}${o.tier === "信使" ? "送达" : "抵"}${o.to}（${o.tier}）` }));
  s.latin = latinWords(s).length;
  return s;
}

/* ───────── 用量记录 ───────── */

// Every completed call is kept, including ones on branches later abandoned: that usage was spent.
function recordUsage(role, chapter, prompt, res, t0) {
  (game.usage = game.usage || []).push({
    role, chapter, model: res.model, tier: res.tier || "",
    inChars: prompt.length, outChars: res.text.length,
    inTok: res.inTok || 0, outTok: res.outTok || 0, ms: Date.now() - t0
  });
  save();
}

function renderUsage() {
  const rows = game.usage || [];
  if (!rows.length) return "";
  const names = { route: "驿程", sim: "推演", narrate: "说书", fix: "改字" };
  const exact = rows.every(r => r.inTok);
  const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + "万" : String(n);
  const line = role => {
    const rs = rows.filter(r => r.role === role);
    if (!rs.length) return "";
    const sum = k => rs.reduce((n, r) => n + r[k], 0);
    const inN = exact ? sum("inTok") : sum("inChars"), outN = exact ? sum("outTok") : sum("outChars");
    const tiers = { default: "默认档", quick: "快速档", complex: "复杂档" };
    const models = [...new Set(rs.map(r => r.model + (r.tier ? " · " + (tiers[r.tier] || r.tier) : "")))].join("，");
    return `<tr><th>${names[role]}</th><td>${rs.length}</td><td>${fmt(inN)}</td><td>${fmt(outN)}</td><td>${Math.round(sum("ms") / 1000)}秒</td></tr>
      <tr class="sub"><td colspan="5">${esc(models)}</td></tr>`;
  };
  return `<section><h3>用量</h3><table class="usage">
    <tr><td></td><td>次</td><td>${exact ? "输入 tokens" : "输入字数"}</td><td>${exact ? "输出 tokens" : "输出字数"}</td><td>耗时</td></tr>
    ${line("route")}${line("sim")}${line("narrate")}${line("fix")}</table>
    <p class="note">${exact ? "按 API 返回的实际 tokens 统计。" : "claude.ai 不返回 tokens，这里按字数统计；中文大致一字一 token。"}含已放弃分支上的调用，不含中途取消的调用。</p></section>`;
}

/* ───────── 一回的流程：先推演、存档，再说书 ───────── */

async function decide(decision) {
  decision = decision.trim();
  if (!decision || busy || !llm) return;
  busy = "sim"; lastError = null;
  game.pending = decision;
  ctl = new AbortController();
  render();
  try {
    let routes = [];
    if (decision !== WAIT_ORDER) {
      // 先用快速档把命令拆成各项，驿程表算出送达日期，再交给推演
      const rp = buildRoutePrompt(game, decision), r0 = Date.now();
      try {
        const rr = await llm.call(rp, () => {}, ctl.signal, { tier: "quick" });
        recordUsage("route", game.chapters.length, rp, rr, r0);
        routes = parseRoutes(rr.text);
      } catch (e) { if (e && e.code === "cancelled") throw e; }
    }
    const orders = scheduleOrders(game, routes);
    const prompt = buildSimPrompt(game, decision, orders), t0 = Date.now();
    const res = await llm.call(prompt, () => {}, ctl.signal);
    recordUsage("sim", game.chapters.length, prompt, res, t0);
    const state = parseSim(game, res.text, orders);
    current().decision = decision;
    current().policy = JSON.parse(JSON.stringify(game.policy));
    game.chapters.push({ title: `第${cn(game.chapters.length + 1)}回`, text: "", state });
    delete game.pending;
    save();
  } catch (e) {
    busy = false; ctl = null;
    if (!e || e.code !== "cancelled") lastError = e || { code: "unknown" };
    render();
    return;
  }
  busy = false;
  await narrate(game.chapters.length - 1);
}

async function narrate(i) {
  if (busy || !llm) return;
  busy = "narrate"; narrating = i; lastError = null; streamText = "";
  ctl = new AbortController();
  render();
  try {
    const prompt = buildNarratePrompt(game, i), t0 = Date.now();
    const res = await llm.call(prompt, t => { streamText = t; renderStream(); }, ctl.signal);
    recordUsage("narrate", i, prompt, res, t0);
    const out = splitStory(res.text);
    if (!out.text) throw { code: "empty_completion" };
    const ps = out.text.split(/\n+/).filter(Boolean);
    const bad = ps.map((p, k) => LATIN.test(p) ? k : -1).filter(k => k >= 0);
    if (bad.length) {
      const fp = buildLatinFixPrompt(bad.map(k => ps[k])), f0 = Date.now();
      try {
        const fr = await llm.call(fp, () => {}, ctl.signal, { tier: "quick" });
        recordUsage("fix", i, fp, fr, f0);
        const fixed = fr.text.split(/\n?=====\n?/).map(x => x.trim());
        if (fixed.length === bad.length) bad.forEach((k, m) => { if (fixed[m]) ps[k] = fixed[m]; });
        out.text = ps.join("\n\n");
      } catch (e) { if (e && e.code === "cancelled") throw e; }
    }
    game.chapters[i].title = out.title || game.chapters[i].title;
    game.chapters[i].text = out.text;
    save();
  } catch (e) {
    if (!e || e.code !== "cancelled") lastError = { ...(e || {}), narrate: true };
  } finally {
    busy = false; ctl = null; streamText = ""; narrating = -1;
    render();
    if (!lastError) document.getElementById("ch-" + i)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function errorCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "未获准调用 Claude，故事无法继续。请在本页的权限设置中允许后刷新。";
  if (c === "rate_limited") return "调用太频繁或已达用量上限，请稍后再试。";
  if (c === "session_expired") return "登录已过期，请重新登录 claude.ai。";
  if (c === "refused") return "Claude 拒绝写这一回。换一种决断试试。";
  if (c === "http_401") return "API Key 无效，请重新填写。";
  if (c === "no_state" || c === "no_choices" || e instanceof SyntaxError) return "推演结果不完整，可以重新推演这一回。";
  if (c === "empty_completion") return "说书人没写出东西。";
  return "驿路不通（连接出错）。可以重试。";
}

/* ───────── 渲染 ───────── */

function render() {
  const main = $("#main"), panel = $("#panel");
  $("#restartBtn").hidden = !game;
  if (!game) {
    panel.hidden = true;
    $("#date").textContent = "";
    main.innerHTML = renderIntro();
    bindIntro();
    return;
  }
  const st = current().state;
  $("#date").textContent = st.date || "";
  panel.hidden = false;
  panel.innerHTML = renderPanel(st);

  const done = !!st.ending;
  if (showReport && done) {
    main.innerHTML = renderReport();
    $("#backBtn").onclick = () => { showReport = false; render(); window.scrollTo(0, 0); };
    return;
  }
  let html = `<div class="story">`;
  game.chapters.forEach((c, i) => {
    const known = (c.state.events || []).filter(e => e.known !== false || done);
    const head = `<div class="chapter-head"><div class="seal">${cn(i + 1)}</div><h2>${esc(c.title.replace(/^第[^回]*回\s*/, ""))}</h2></div>`;
    const body = c.text ? `${head}<div class="body">${paras(c.text)}</div>`
      : busy === "narrate" && narrating === i
        ? `<p class="writing" id="writing"><span>军情已定，说书人正在构思<span class="dots"></span></span><button class="ui-btn" id="stopBtn" type="button">先不写了</button></p><div class="body" id="liveBody">${head}</div>`
        : `${head}<div class="notice"><span>${lastError && lastError.narrate && i === game.chapters.length - 1 ? esc(errorCopy(lastError)) + " " : ""}这一回的事已经定下，还没写成文字。下面的军情就是本回发生的事。</span><div class="row"><button class="ui-btn" type="button" data-narrate="${i}" ${busy || !llm ? "disabled" : ""}>写成这一回</button></div></div>`;
    html += `<section class="chapter" id="ch-${i}">
      ${body}
      ${i > 0 && known.length ? `<details class="events" ${c.text ? "" : "open"}><summary>本回军情 · ${known.length} 条</summary><ul>${known.map(e => `<li class="${e.known === false ? "secret" : ""}"><span class="when">${esc(e.date)}</span><b>${esc(e.who)}</b>${e.where ? `（${esc(e.where)}）` : ""}${esc(e.what)}${e.result ? `，${esc(e.result)}` : ""}${e.known === false ? `<em>暗</em>` : ""}</li>`).join("")}</ul></details>` : ""}
      ${(c.state.autonomous || []).length ? `<div class="auto"><h4>前方自决</h4><ul>${c.state.autonomous.map(a => `<li><b>${esc(a.who)}</b>${esc(a.did)}</li>`).join("")}</ul></div>` : ""}
      ${c.decision ? `<div class="decision"><span>汉中王令</span><b>${esc(c.decision)}</b>${busy ? "" : `<button class="redo" type="button" data-redo="${i}">回到此处另作决断</button>`}</div>` : ""}
    </section>`;
    if (c.decision) html += `<div class="divider">· · ·</div>`;
  });

  if (busy === "sim") {
    html += `<div class="decision"><span>汉中王令</span><b>${esc(game.pending)}</b></div>
      <section class="chapter" id="live">
        <p class="writing" id="writing"><span>驿马奔驰，各方正在行动<span class="dots"></span></span><button class="ui-btn" id="stopBtn" type="button">收回此令</button></p>
      </section>`;
  } else if (busy) {
  } else if (st.ending) {
    html += renderEnding(st);
  } else {
    if (lastError && !lastError.narrate) html += `<div class="notice"><span>${esc(errorCopy(lastError))}</span><div class="row"><button class="ui-btn" id="retryBtn" type="button">重新推演</button></div></div>`;
    html += renderChoices(st);
  }
  html += `</div>`;
  main.innerHTML = html;
  bindStory();
  if (busy === "narrate") renderStream();
}

function renderStream() {
  const body = $("#liveBody");
  if (!body) return;
  if (!streamText) return;
  const { title, text } = splitStory(streamText);
  $("#writing").firstElementChild.innerHTML = `说书人正在落笔<span class="dots"></span>`;
  body.innerHTML = `<div class="chapter-head"><div class="seal">${cn(narrating + 1)}</div><h2>${esc(title.replace(/^第[^回]*回\s*/, ""))}</h2></div>${paras(text)}`;
}

function renderChoices(st) {
  const off = !llm;
  return `<div class="choices">
    <h3>汉中王当如何决断</h3>
    ${st.assessment ? `<p class="assess">${esc(st.assessment)}</p>` : ""}
    ${(st.counsel || []).length ? `<div class="counsel"><h4>谋士进言</h4>${st.counsel.map(c => `<div class="cs"><span class="who">${esc(c.who)}<small>${esc(c.how)}</small></span><p>${esc(c.says)}</p></div>`).join("")}</div>` : ""}
    ${off ? `<div class="notice"><span>${window.claude ? "正在连接 Claude……若长时间无反应，请在 claude.ai 中打开本页。" : "本地运行需要 Anthropic API Key 才能续写故事。"}</span>${window.claude ? "" : `<div class="row"><button class="ui-btn" id="keyBtn" type="button">填写 API Key</button></div>`}</div>` : ""}
    <div class="choice-list">
      ${(st.choices || []).map((c, i) => {
        const by = (st.counsel || []).filter(x => Number(x.choice) === i + 1).map(x => x.who);
        return `<button class="choice" type="button" data-choice="${i}" ${off ? "disabled" : ""}><b>${esc(c.label)}${by.length ? `<em class="by">${esc(by.join("、"))}之议</em>` : ""}</b><span>${esc(c.detail)}</span></button>`;
      }).join("")}
      <button class="choice quiet" type="button" id="waitBtn" ${off ? "disabled" : ""}><b>不另发令，静观其变</b><span>前方将帅依你的方略与授权自行处置，省去驿马往返</span></button>
    </div>
    ${renderPolicy(st)}
    <div class="own">
      <label for="ownOrder">或者亲书一道手令（谁去、做什么、怎么做）</label>
      <textarea id="ownOrder" placeholder="例：遣简雍星夜赴江陵，令糜芳将家眷送往成都，另选廖化代守公安。"></textarea>
      <div class="row"><button class="primary" id="ownBtn" type="button" ${off ? "disabled" : ""}>发出手令</button></div>
    </div>
  </div>`;
}

function renderPolicy(st) {
  const fig = n => (st.figures || []).find(f => f.name === n);
  const active = DELEGATES.filter(n => { const f = fig(n); return f && f.where !== "成都" && f.where !== "已故"; });
  return `<div class="policy">
    <h3>方略与授权</h3>
    <p class="hint">驿马到江陵要十余日，到樊城还要更久，前方不能事事等你。授权"便宜行事"的人会按自己的判断和你的方略当机立断。方略和授权随下一道命令一并送出。</p>
    ${active.map(n => `<div class="power"><span class="who">${n}</span><div class="seg" role="group" aria-label="${n}的授权">${Object.keys(POWERS).map(p => `<button type="button" data-who="${n}" data-power="${p}" aria-pressed="${game.policy.powers[n] === p}" title="${POWERS[p]}">${p}</button>`).join("")}</div><span class="desc">${POWERS[game.policy.powers[n]]}</span></div>`).join("")}
    <label for="policyText">总方略（前方将帅据此自决）</label>
    <textarea id="policyText" placeholder="例：以保荆州根本为先。樊城可围则围，不可则退。江东若有异动，云长即刻回师，孔明可先斩后奏。">${esc(game.policy.text)}</textarea>
  </div>`;
}

function renderEnding(st) {
  const e = st.ending;
  const hiddenAll = [...new Set(game.chapters.flatMap(c => c.state.hidden || []))];
  return `<div class="ending">
    <div class="k">终章 · ${esc(OPENINGS[game.start].label)}</div>
    <h3>${esc(e.title)}</h3>
    <p>${esc(e.summary)}</p>
    <h4>与原著对照</h4><p>${esc(e.vs_canon)}</p>
    ${(e.turning_points || []).length ? `<h4>转折</h4><ol>${e.turning_points.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
    <h4>伏笔揭晓</h4>
    <div class="reveals">${game.chapters.map((c, i) => (c.state.foreshadow || []).map(f => `<div class="reveal"><span class="where">第${cn(i + 1)}回</span><q>${esc(f.line)}</q><p>${esc(f.truth)}</p></div>`).join("")).join("")}</div>
    <h4>历回暗线</h4><ol>${hiddenAll.map(h => `<li>${esc(h)}</li>`).join("")}</ol>
  </div>
  <div class="own"><div class="row"><button class="ui-btn" id="reportBtn" type="button">查看战报</button><button class="primary" id="againBtn" type="button">另开一局</button></div></div>`;
}

/* 战报：终局后把每回的全部事件（含暗线）、自决、伏笔、选项与命令按回列出 */
function renderReport() {
  const FC = { "刘": "shu", "孙": "wu", "曹": "wei", "争": "war" };
  const keys = ["江陵", "公安", "麦城", "樊城"];
  const chs = game.chapters, end = current().state.ending;
  const chapter = (c, i) => {
    const s = c.state, prev = chs[i - 1];
    const delta = k => {
      const d = prev ? s.gauges[k] - prev.state.gauges[k] : 0;
      return d ? `<span class="rp-d ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${d}</span>` : "";
    };
    const evs = s.events || [];
    return `<article class="rp-ch">
      <header><span class="rp-no">第${cn(i + 1)}回</span><span class="rp-date">${esc(s.date)}</span>
        <span class="rp-places">${keys.map(k => `<span class="rp-pl" style="background:var(--${FC[s.places[k]] || "war"})">${k}·${esc(s.places[k])}</span>`).join("")}</span></header>
      <div class="rp-g">后方 <b>${s.gauges["后方"]}</b>${delta("后方")}　前线 <b>${s.gauges["前线"]}</b>${delta("前线")}　孙刘 <b>${s.gauges["孙刘"]}</b>${delta("孙刘")}</div>
      ${i > 0 && evs.length ? `<h4>本回事件<span class="rp-m">　${evs.length} 条，当时汉中王得知 ${evs.filter(e => e.known !== false).length} 条</span></h4>
      <ol class="rp-ev">${evs.map(e => `<li class="${e.known === false ? "dark" : ""}"><span class="when">${esc(e.date)}</span><b>${esc(e.who)}</b><span class="rp-m">@${esc(e.where)}</span> ${esc(e.what)}${e.why ? `<span class="rp-m">（${esc(e.why)}）</span>` : ""} → ${esc(e.result)}${e.known === false ? "<em>暗</em>" : ""}</li>`).join("")}</ol>` : ""}
      ${(s.autonomous || []).length ? `<h4>前方自决</h4><ul>${s.autonomous.map(a => `<li><b>${esc(a.who)}</b> ${esc(a.did)}</li>`).join("")}</ul>` : ""}
      ${(s.foreshadow || []).length ? `<h4>伏笔</h4><ul>${s.foreshadow.map(f => `<li>「${esc(f.line)}」<span class="rp-m"> → ${esc(f.truth)}</span></li>`).join("")}</ul>` : ""}
      ${(s.plans || []).length && i > 0 ? `<h4>各方谋划</h4><ul>${s.plans.map(p => `<li><b>${esc(p.side)}</b>〔${esc(p.status)}〕${esc(p.plan)}<span class="rp-m">　所知：${esc(p.knows)}</span></li>`).join("")}</ul>` : ""}
      ${(s.delivered || []).length ? `<h4>本回送达的军令</h4><ul>${s.delivered.map(o => `<li>${esc(orderLine(o))}</li>`).join("")}</ul>` : ""}
      ${(s.counsel || []).length ? `<h4>谋士进言</h4><ul>${s.counsel.map(c => `<li><b>${esc(c.who)}</b><span class="rp-m">（${esc(c.how)}）</span> ${esc(c.says)}</li>`).join("")}</ul>` : ""}
      ${(s.choices || []).length ? `<h4>当时的选项</h4><ul>${s.choices.map(o => `<li><b>${esc(o.label)}</b><span class="rp-m">　${esc(o.detail)}</span></li>`).join("")}</ul>` : ""}
      ${c.decision ? `<div class="decision"><span>汉中王令</span><b>${esc(c.decision)}</b></div>` : ""}
    </article>`;
  };
  return `<div class="story report">
    <div class="rp-top"><h2>战报 · ${esc(OPENINGS[game.start].label)}</h2><button class="ui-btn" id="backBtn" type="button">回到故事</button></div>
    <p class="rp-verdict">结局「${esc(end.title)}」　${esc(end.summary)}</p>
    <p class="rp-m">灰色带“暗”字的事件，是那一回结束时汉中王还不知道的。</p>
    ${chs.map(chapter).join("")}
  </div>`;
}

function renderPanel(st) {
  const done = !!st.ending;
  const gauge = (k, label) => {
    const v = Math.max(0, Math.min(100, Number(st.gauges[k]) || 0));
    return `<div class="gauge"><span>${label}</span><div class="bar"><i class="${v < 35 ? "low" : ""}" style="width:${v}%"></i></div><span class="n">${v}</span></div>`;
  };
  return `
    <section class="map"><h3>荆襄形势</h3>${renderMap(st.places)}
      <div class="legend"><span><i style="background:var(--shu)"></i>刘</span><span><i style="background:var(--wu)"></i>孙</span><span><i style="background:var(--wei)"></i>曹</span><span><i style="background:var(--war)"></i>交战</span></div></section>
    <section><h3>大势</h3><div class="gauges">${gauge("后方", "荆州后方")}${gauge("前线", "襄樊前线")}${gauge("孙刘", "孙刘之好")}</div></section>
    ${(st.forces || []).length ? `<section><h3>兵马</h3><dl class="figures forces">${st.forces.map(f => `<div class="fig"><dt>${esc(f.name)}</dt><dd><b>${esc(f.where)}</b>　${esc(f.troops)}${f.grain ? `<span class="grain">粮：${esc(f.grain)}</span>` : ""}${f.note ? `　${esc(f.note)}` : ""}</dd></div>`).join("")}</dl></section>` : ""}
    <section><h3>人物</h3><dl class="figures">${(st.figures || []).map(f => `<div class="fig ${f.where === "已故" ? "dead" : ""}"><dt>${esc(f.name)}</dt><dd><b>${esc(f.where)}</b>　${esc(f.note)}</dd></div>`).join("")}</dl></section>
    ${(st.in_transit || []).length ? `<section><h3>在途军令</h3><ul class="intel">${st.in_transit.map(o => `<li>${esc(o.order)}<span class="eta">　${esc(o.eta)}</span></li>`).join("")}</ul></section>` : ""}
    <section><h3>汉中王所知</h3><ul class="intel">${(st.intel || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
    <section class="hidden-box"><h3>暗线</h3>${done || peek
      ? `<ul>${(st.hidden || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
      : `<p>此刻另有 ${(st.hidden || []).length} 条汉中王不知道的暗线；正文中已埋下 ${game.chapters.reduce((n, c) => n + (c.state.foreshadow || []).length, 0)} 处伏笔，终章逐条揭晓。</p><p><button class="redo-link" id="peekBtn" type="button">现在就看</button></p>`}
      ${peek && !done ? `<ul>${game.chapters.flatMap((c, i) => (c.state.foreshadow || []).map(f => `<li>第${cn(i + 1)}回「${esc(f.line)}」：${esc(f.truth)}</li>`)).join("")}</ul>` : ""}</section>
    ${renderUsage()}
    <section><h3>纪事</h3><ol class="chron">${game.chapters.map(c => `<li>${esc(c.state.chronicle || c.title.replace(/^第[^回]*回\s*/, ""))}</li>`).join("")}</ol></section>`;
}

const MOUNTAINS = [
  ["秦岭", [[40, 64], [56, 58], [72, 64], [96, 57], [112, 62], [130, 58]], [62, 48, "start"]],
  ["大巴山", [[60, 136], [76, 130], [92, 137], [108, 129], [124, 135]], [70, 150, "start"]],
  ["巫山·三峡", [[100, 184], [114, 178], [128, 184]], [88, 170, "start"]],
  ["武当", [[176, 112], [190, 106], [204, 112]], [210, 112, "start"]],
  ["荆山", [[174, 146], [187, 140]], [166, 145, "end"]]
];

function renderMap(places) {
  const peaks = MOUNTAINS.map(([name, pts, [lx, ly, anchor]]) => pts.map(([x, y]) =>
    `<path d="M${x - 7},${y} L${x},${y - 9} L${x + 7},${y} Z" fill="var(--mount-fill)" stroke="var(--mount)" stroke-width="1" stroke-linejoin="round"/>`).join("") +
    `<text x="${lx}" y="${ly}" font-size="8" fill="var(--muted)" text-anchor="${anchor}">${name}</text>`).join("");
  const nodes = Object.entries(PLACES).map(([name, [x, y]]) => {
    const h = places[name] || OPENINGS.canon.state.places[name] || "争";
    const color = `var(${FACTION[h] || "--war"})`;
    const right = x > 360;
    return `<g><circle cx="${x}" cy="${y}" r="${name === "江陵" ? 7 : 5}" fill="${color}" stroke="var(--paper)" stroke-width="1.5"/>
      <text x="${right ? x - 9 : x + 9}" y="${y + 4}" font-size="11" fill="var(--ink)" text-anchor="${right ? "end" : "start"}">${name}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 400 236" role="img" aria-label="荆襄形势图">
    <path d="M10,222 C90,222 160,198 232,190 S290,214 330,206 S372,196 398,194" fill="none" stroke="var(--river)" stroke-width="4" stroke-linecap="round"/>
    <path d="M70,98 C120,96 180,96 226,80 C242,118 262,166 290,202" fill="none" stroke="var(--river)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="22" y="236" font-size="9" fill="var(--muted)">长江</text>
    <text x="104" y="110" font-size="9" fill="var(--muted)">汉水</text>
    ${peaks}
    ${nodes}
  </svg>`;
}

function renderIntro() {
  const saved = load();
  return `<div class="intro story">
    <h1>异章·荆州</h1>
    <p class="tag">建安二十四年秋，关羽水淹七军，威震华夏。三个月后，荆州易主，关羽死于麦城。</p>
    <p>这一回，你是汉中王刘备，远在成都。每一回你下一道命令，驿马要走十多天才能送到江陵，再到樊城前线还要几天。关羽、孔明、糜芳、孙权、吕蒙、曹操，各有各的打算，没人会照着剧本走。</p>
    <p>选一个起点：</p>
    <div class="starts">
      ${Object.entries(OPENINGS).map(([k, o]) => `<button class="start-card" type="button" data-start="${k}"><span class="k">${k === "canon" ? "起点一" : "起点二"}</span><strong>${esc(o.label)}</strong><span>${esc(o.blurb)}</span></button>`).join("")}
    </div>
    ${saved && saved.chapters ? `<p><button class="ui-btn" id="resumeBtn" type="button">继续上次的故事（${esc(OPENINGS[saved.start].label)}，已到第${cn(saved.chapters.length)}回）</button></p>` : ""}
    ${window.claude ? "" : `<div class="keybox">
      <label for="apiKey">本地运行时，故事由 Claude API 续写。Key 只保存在这台电脑的浏览器里。</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…">
      <div><button class="ui-btn" id="saveKey" type="button">保存 Key</button> <span id="keyMsg"></span></div>
    </div>`}
  </div>`;
}

/* ───────── 交互 ───────── */

function startGame(k) {
  const o = OPENINGS[k];
  game = { start: k, policy: defaultPolicy(), chapters: [{ title: o.title, text: o.text, state: JSON.parse(JSON.stringify(o.state)) }] };
  lastError = null;
  save();
  render();
  window.scrollTo(0, 0);
}

function bindIntro() {
  document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startGame(b.dataset.start));
  const r = $("#resumeBtn");
  if (r) r.onclick = () => { game = load(); delete game.pending; game.policy = game.policy || defaultPolicy(); render(); };
  const sk = $("#saveKey");
  if (sk) {
    try { $("#apiKey").value = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}
    sk.onclick = () => {
      try { localStorage.setItem(KEY_STORE, $("#apiKey").value.trim()); } catch (e) {}
      setupKeyLLM();
      $("#keyMsg").textContent = llm ? "已保存" : "已清除";
    };
  }
}

function bindStory() {
  document.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => decide(current().state.choices[+b.dataset.choice].label));
  document.querySelectorAll("[data-redo]").forEach(b => b.onclick = () => {
    const i = +b.dataset.redo;
    game.chapters = game.chapters.slice(0, i + 1);
    if (game.chapters[i].policy) game.policy = game.chapters[i].policy;
    delete game.chapters[i].decision;
    delete game.chapters[i].policy;
    lastError = null;
    save(); render();
    document.getElementById("ch-" + i)?.scrollIntoView({ behavior: "smooth", block: "end" });
  });
  document.querySelectorAll("[data-narrate]").forEach(b => b.onclick = () => narrate(+b.dataset.narrate));
  const pk = $("#peekBtn");
  if (pk) pk.onclick = () => { peek = true; render(); };
  const wait = $("#waitBtn");
  if (wait) wait.onclick = () => decide(WAIT_ORDER);
  document.querySelectorAll("[data-power]").forEach(b => b.onclick = () => {
    game.policy.powers[b.dataset.who] = b.dataset.power;
    save(); render();
  });
  const pol = $("#policyText");
  if (pol) pol.oninput = () => { game.policy.text = pol.value; save(); };
  const own = $("#ownBtn");
  if (own) own.onclick = () => decide($("#ownOrder").value);
  const stop = $("#stopBtn");
  if (stop) stop.onclick = () => ctl && ctl.abort();
  const retry = $("#retryBtn");
  if (retry) retry.onclick = () => decide(game.pending || "");
  const rb = $("#reportBtn");
  if (rb) rb.onclick = () => { showReport = true; render(); window.scrollTo(0, 0); };
  const again = $("#againBtn");
  if (again) again.onclick = restart;
  const kb = $("#keyBtn");
  if (kb) kb.onclick = () => { game = null; render(); window.scrollTo(0, 0); };
}

let restartArmed = false;
function restart() {
  if (game && !current().state.ending && !restartArmed) {
    restartArmed = true;
    $("#restartBtn").textContent = "再点一次确认";
    setTimeout(() => { restartArmed = false; $("#restartBtn").textContent = "另开一局"; }, 3000);
    return;
  }
  restartArmed = false;
  $("#restartBtn").textContent = "另开一局";
  if (ctl) ctl.abort();
  game = null; lastError = null; peek = false; showReport = false;
  render();
  window.scrollTo(0, 0);
}

$("#restartBtn").onclick = restart;
$("#panelToggle").onclick = () => {
  const p = $("#panel");
  p.classList.toggle("collapsed");
  $("#panelToggle").setAttribute("aria-expanded", String(!p.classList.contains("collapsed")));
};

function boot(data) {
  game = (data && data.game) || load();
  if (game) { delete game.pending; game.policy = game.policy || defaultPolicy(); }
  render();
  initLLM();
}
window.claude?.hot?.snapshot?.(() => ({ game: busy ? null : game }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
