name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jingzhou:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m altertale compare
      - run: python -m pip install .
      - name: Verify installed package outside the checkout
        working-directory: /tmp
        run: altertale compare --output /tmp/altertale-installed-demo
