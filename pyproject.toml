[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altertale"
version = "0.1.0"
description = "A small, inspectable counterfactual narrative experiment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
altertale = "altertale.cli:main"

[tool.setuptools]
packages = ["altertale"]

[tool.setuptools.package-data]
altertale = ["data/*.json"]
